spring.application.name=job-portal
server.port=${PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.thymeleaf.cache=false
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
app.demo.candidate.email=${DEMO_CANDIDATE_EMAIL:candidate@demo.local}
app.demo.candidate.password=${DEMO_CANDIDATE_PASSWORD:CandidateDemo123!}
app.demo.recruiter.email=${DEMO_RECRUITER_EMAIL:recruiter@demo.local}
app.demo.recruiter.password=${DEMO_RECRUITER_PASSWORD:RecruiterDemo123!}
app.demo.admin.email=${DEMO_ADMIN_EMAIL:admin@demo.local}
app.demo.admin.password=${DEMO_ADMIN_PASSWORD:AdminDemo123!}
